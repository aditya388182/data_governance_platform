# REQUIRED status check `impact-bot` (consumer impact analysis).
# Runs on EVERY PR. Analyzes field-level usage of schemas via AST scanning
# and reads ACKs from main.
name: impact-bot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: impact-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-bot:
    name: impact-bot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout (full history for the merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect impact changes (a detection error fails the job)
        id: detect
        run: scripts/ci/impact_gate.sh detect "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Nothing to check — pass
        if: steps.detect.outputs.run == 'false'
        run: echo "impact-bot — no change to schemas, lineage, consumers or gate code. Nothing to check."

      - name: Set up Python
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: python -m pip install --quiet -r requirements.txt

      - name: Self-test impact logic
        if: steps.detect.outputs.run == 'true'
        run: python -m pytest -q tests/impact

      - name: Impact analysis gate
        id: impact_gate
        if: steps.detect.outputs.run == 'true'
        run: scripts/ci/impact_gate.sh check "$BASE_SHA"

      - name: Post comment and enforce verdict
        if: always() && steps.detect.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tempDir = process.env.RUNNER_TEMP;
            const commentFile = path.join(tempDir, 'impact-bot', 'comment.md');
            const actionFile = path.join(tempDir, 'impact-bot', 'action.json');
            
            // 1. Post or update the Markdown table comment
            if (fs.existsSync(commentFile)) {
              const commentBody = fs.readFileSync(commentFile, 'utf8');
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- impact-bot -->'));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody
                });
              }
            }
            
            // 2. Apply labels and request reviewers if a breaking change is detected
            if (fs.existsSync(actionFile)) {
              const actionStr = fs.readFileSync(actionFile, 'utf8');
              const actionInfo = JSON.parse(actionStr);
              
              if (actionInfo.label) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['breaking-change']
                });
              }
              
              if (actionInfo.reviewers && actionInfo.reviewers.length > 0) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    reviewers: actionInfo.reviewers.map(r => r.replace('@', ''))
                  });
                } catch (err) {
                  console.log("reviewer request skipped (HTTP 422) - expected on personal accounts");
                }
              }
            }