# REQUIRED status check `ge-gate` (the semantic layer).
# Same shape as schema-gate (decision D3): runs on EVERY PR, decides relevance
# inside the job, and a detection error fails the job. No registry or Docker:
# it validates the committed, anonymized fixtures with the versioned GE suites.
name: ge-gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ge-gate:
    name: ge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GE_USAGE_STATS: "FALSE"
      PYTHONWARNINGS: ignore
    steps:
      - name: Checkout (full history for the merge-base)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect semantic-contract changes (a detection error fails the job)
        id: detect
        run: scripts/ci/ge_gate.sh detect "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Nothing semantic changed — pass
        if: steps.detect.outputs.run == 'false'
        run: echo "ge-gate — no change to contracts, suites, fixtures or gate code. Nothing to check."

      - name: Set up Python (pip cache keyed on the pinned requirements)
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci-semantic.txt

      - name: Install pinned Great Expectations 0.18 stack
        if: steps.detect.outputs.run == 'true'
        run: python -m pip install --quiet -r requirements-ci-semantic.txt

      - name: Self-test semantic gate logic
        if: steps.detect.outputs.run == 'true'
        run: python -m pytest -q tests/semantic

      - name: Semantic contract gate (suites vs fixtures)
        if: steps.detect.outputs.run == 'true'
        run: scripts/ci/ge_gate.sh check "$BASE_SHA"