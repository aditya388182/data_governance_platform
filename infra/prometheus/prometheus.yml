# Checkpoint jobs are batch jobs, so they PUSH to the Pushgateway and Prometheus scrapes it.
# honor_labels keeps the pushed `job` / `dataset` labels instead of overwriting them.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
