# runtime governance alerts .
# The checkpoint pushes gauges per dataset (contract 11): ge_checkpoint_pass,
# quarantine_rows_total, quarantine_rows_last_run, ge_checkpoint_last_run_timestamp_seconds.
# Pushgateway keeps the LAST pushed value, so an alert stays FIRING until the next
# checkpoint run reports otherwise (i.e. until the owner has remediated).
groups:
  - name: governance-runtime
    rules:
      - alert: GECheckpointFailing
        expr: ge_checkpoint_pass == 0
        labels:
          severity: page
        annotations:
          summary: "Live table {{ $labels.dataset }} violates its GE suite"
          description: "Offending rows were copied to quarantine (read-only on the source). The dataset owner in contracts/registry.yml remediates. Runbook: docs/runbooks/quarantine.md"
      - alert: QuarantineRowsAdded
        expr: quarantine_rows_last_run > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} new row(s) quarantined for {{ $labels.dataset }}"
          description: "A producer wrote rows that CI would have rejected. Runbook: docs/runbooks/quarantine.md"
      - alert: GECheckpointStale
        expr: time() - ge_checkpoint_last_run_timestamp_seconds > 2 * 86400
        labels:
          severity: ticket
        annotations:
          summary: "No checkpoint for {{ $labels.dataset }} in 2 days — the scheduler may be down"
