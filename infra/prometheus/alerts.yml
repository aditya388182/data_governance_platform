# runtime governance alerts.
# The checkpoint pushes gauges per dataset (contract 11): ge_checkpoint_pass,
# quarantine_rows_total, quarantine_rows_last_run, ge_checkpoint_last_run_timestamp_seconds.
# Pushgateway keeps the LAST pushed value, so an alert stays FIRING until the next
# checkpoint run reports otherwise (i.e. until the owner has remediated).
groups:
  - name: governance-runtime
    rules:
      - alert: GECheckpointFailing
        expr: ge_checkpoint_pass == 0
        labels:
          severity: page
        annotations:
          summary: "Live table {{ $labels.dataset }} violates its GE suite"
          description: "Offending rows were copied to quarantine (read-only on the source). The dataset owner in contracts/registry.yml remediates. Runbook: docs/runbooks/quarantine.md"
      - alert: QuarantineRowsAdded
        expr: quarantine_rows_last_run > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} new row(s) quarantined for {{ $labels.dataset }}"
          description: "A producer wrote rows that CI would have rejected. Runbook: docs/runbooks/quarantine.md"
      - alert: GECheckpointStale
        expr: time() - ge_checkpoint_last_run_timestamp_seconds > 2 * 86400
        labels:
          severity: ticket
        annotations:
          summary: "No checkpoint for {{ $labels.dataset }} in 2 days — the scheduler may be down"


  - name: infrastructure-drift
    rules:
      - alert: TerraformDrift
        expr: max by (workspace, resource, attribute) (terraform_drift_attribute) > 0
        labels:
          severity: page
        annotations:
          summary: "Drift in {{ $labels.workspace }}: {{ $labels.resource }} {{ $labels.attribute }} was changed outside Terraform"
          description: "terraform plan -detailed-exitcode returned 2 and the plan's resource_drift names this attribute. Remediate by re-applying the code, or adopt the change in code through a PR. Never edit state. Runbook: docs/runbooks/terraform_drift.md"
      - alert: TerraformDriftCheckFailing
        expr: max by (workspace) (terraform_drift_check_ok) == 0
        labels:
          severity: ticket
        annotations:
          summary: "Drift check for {{ $labels.workspace }} could not plan — drift status UNKNOWN, not clean"
          description: "terraform plan exited 1 (LocalStack/Kafka/Schema Registry down, or credentials). Fail closed: fix the plan, rerun scripts/drift_check.py."
      - alert: TerraformDriftCheckStale
        expr: time() - terraform_drift_last_run_timestamp_seconds > 2 * 86400
        labels:
          severity: ticket
        annotations:
          summary: "No drift check for {{ $labels.workspace }} in 2 days — the scheduler may be down"
